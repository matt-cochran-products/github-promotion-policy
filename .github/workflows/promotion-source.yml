name: promotion-source

on:
  pull_request:

permissions: {}

jobs:
  validate-source:
    name: validate-source
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Enforce feature to dev to staging to main
        env:
          CI_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE || 'github' }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # Fork branch names are attacker-chosen; only same-repository
          # branches may use the hotfix lane.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # The repository running this required workflow, set by GitHub.
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "${CI_RUNNER_MODE:-github}" in
            github|blacksmith) ;;
            *) echo '::error::CI_RUNNER_MODE must be github or blacksmith'; exit 1 ;;
          esac
          # Hotfix lane: a same-repository hotfix/* branch may target staging
          # or main directly, so a production fix need not ship everything
          # waiting on dev. Open the matching hotfix PR into dev as well.
          hotfix=false
          if [ "$SAME_REPO" = "true" ]; then
            case "$HEAD_REF" in hotfix/?*) hotfix=true ;; esac
          fi
          # Back-merge lane: infra alone may merge its own main/staging into
          # dev, paired with merge-policy-dev-backmerge allowing merge commits
          # there, so dev keeps their ancestry. Everywhere else dev stays
          # feature-only.
          backmerge=false
          if [ "$SAME_REPO" = "true" ] && [ "$REPOSITORY" = "matt-cochran-products/infra" ]; then
            case "$HEAD_REF" in staging|main) backmerge=true ;; esac
          fi
          case "$BASE_REF" in
            dev)
              case "$HEAD_REF" in
                dev|staging|main)
                  [ "$backmerge" = "true" ] || {
                    echo "::error::dev accepts feature branches, not $HEAD_REF"
                    exit 1
                  }
                  ;;
              esac
              ;;
            staging)
              [ "$HEAD_REF" = "dev" ] || [ "$hotfix" = "true" ] || {
                echo "::error::staging accepts only dev or a hotfix/* branch; got $HEAD_REF"
                exit 1
              }
              ;;
            main)
              [ "$HEAD_REF" = "staging" ] || [ "$hotfix" = "true" ] || {
                echo "::error::main accepts only staging or a hotfix/* branch; got $HEAD_REF"
                exit 1
              }
              ;;
            *)
              echo "::error::unexpected protected target: $BASE_REF"
              exit 1
              ;;
          esac
