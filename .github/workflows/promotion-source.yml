name: promotion-source

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  validate-source:
    name: validate-source
    runs-on: ${{ vars.CI_RUNNER_MODE == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Enforce feature to dev to staging to main
        env:
          CI_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE || 'github' }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # Fork branch names are attacker-chosen; only same-repository
          # branches may use the hotfix lane.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # The repository running this required workflow, set by GitHub.
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "${CI_RUNNER_MODE:-github}" in
            github|blacksmith) ;;
            *) echo '::error::CI_RUNNER_MODE must be github or blacksmith'; exit 1 ;;
          esac
          # A same-repository hotfix may enter staging for full validation.
          # Main accepts staging only until an isolated hotfix artifact/acceptance
          # contract exists. A branch prefix never permits a main rebuild.
          hotfix=false
          if [ "$SAME_REPO" = "true" ]; then
            case "$HEAD_REF" in hotfix/?*) hotfix=true ;; esac
          fi
          # Back-merge lane: infra and business-ops may merge their own main/staging into
          # dev, paired with merge-policy-dev-backmerge allowing merge commits
          # there, so dev keeps their ancestry. Everywhere else dev stays
          # feature-only.
          backmerge=false
          if [ "$SAME_REPO" = "true" ]; then
            case "$REPOSITORY" in
              matt-cochran-products/infra|matt-cochran-products/business-ops)
                case "$HEAD_REF" in staging|main) backmerge=true ;; esac
                ;;
            esac
          fi
          case "$BASE_REF" in
            dev)
              case "$HEAD_REF" in
                dev|staging|main)
                  [ "$backmerge" = "true" ] || {
                    echo "::error::dev accepts feature branches, not $HEAD_REF"
                    exit 1
                  }
                  ;;
              esac
              ;;
            staging)
              [ "$SAME_REPO" = "true" ] || { echo '::error::staging promotion must be same-repository'; exit 1; }
              [ "$HEAD_REF" = "dev" ] || [ "$hotfix" = "true" ] || {
                echo "::error::staging accepts only dev or a hotfix/* branch; got $HEAD_REF"
                exit 1
              }
              ;;
            main)
              [ "$SAME_REPO" = "true" ] || { echo '::error::main promotion must be same-repository'; exit 1; }
              [ "$HEAD_REF" = "staging" ] || {
                echo "::error::main accepts only validated staging; got $HEAD_REF"
                exit 1
              }
              ;;
            *)
              echo "::error::unexpected protected target: $BASE_REF"
              exit 1
              ;;
          esac
